<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Procedural 3D Track Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #090a0f; font-family: 'Inter', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body class="select-none">

    <!-- UI Overlay -->
    <div class="absolute top-4 left-4 z-10 bg-slate-900/90 backdrop-blur-md border border-cyan-500/30 p-5 rounded-2xl shadow-2xl max-w-xs text-white">
        <h1 class="text-lg font-bold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500 mb-1">3D Track Generator</h1>
        <p class="text-xs text-slate-400 mb-4">Процедурная генерация 3D-трасс на Three.js (3D Catmull-Rom Splines)</p>
        
        <div class="space-y-2">
            <label class="text-xs text-slate-300 font-semibold block">Тип трассы:</label>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="generateTrack('hilly')" class="px-3 py-2 text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl transition text-cyan-300">Холмы</button>
                <button onclick="generateTrack('coaster')" class="px-3 py-2 text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl transition text-pink-400">Горки</button>
                <button onclick="generateTrack('serpentine')" class="px-3 py-2 text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl transition text-emerald-400">Серпантин</button>
                <button onclick="generateTrack('figure8')" class="px-3 py-2 text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl transition text-amber-400">Восьмерка</button>
            </div>

            <button onclick="generateRandomTrack()" class="w-full mt-3 py-2.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold text-xs rounded-xl shadow-lg transition transform active:scale-95 flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                Сгенерировать случайную 3D-трассу
            </button>
        </div>

        <div class="mt-4 pt-3 border-t border-slate-800 text-[10px] text-slate-400 space-y-1 font-mono">
            <div>Контрольные точки: <span id="stat-points" class="text-cyan-400">0</span></div>
            <div>Длина трассы: <span id="stat-length" class="text-emerald-400">0m</span></div>
            <div>Макс. высота Y: <span id="stat-height" class="text-pink-400">0m</span></div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let trackMesh, borderLinesMesh, pillarsGroup;

        // Инициализация Three.js сцены
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0c14);
            scene.fog = new THREE.FogExp2(0x0a0c14, 0.003);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 80, 140);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 - 0.01;

            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x38bdf8, 1.2);
            dirLight.position.set(100, 150, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Сетка земли
            const gridHelper = new THREE.GridHelper(400, 40, 0x1e293b, 0x0f172a);
            gridHelper.position.y = -0.5;
            scene.add(gridHelper);

            pillarsGroup = new THREE.Group();
            scene.add(pillarsGroup);

            window.addEventListener('resize', onWindowResize);

            // Первая генерация
            generateTrack('hilly');
            animate();
        }

        // Алгоритм создания 3D-контрольных точек
        function getControlPoints(type) {
            const points = [];
            const count = 12;
            const radius = 60;

            for (let i = 0; i < count; i++) {
                const angle = (i / count) * Math.PI * 2;
                let x = Math.cos(angle) * radius;
                let z = Math.sin(angle) * radius;
                let y = 0;

                switch(type) {
                    case 'hilly':
                        x += (Math.random() - 0.5) * 20;
                        z += (Math.random() - 0.5) * 20;
                        y = Math.sin(i * 1.5) * 15 + Math.cos(i * 0.8) * 10;
                        break;
                    case 'coaster':
                        x = Math.cos(angle) * (radius + Math.sin(i * 2) * 25);
                        z = Math.sin(angle) * (radius + Math.sin(i * 2) * 25);
                        y = Math.pow(Math.sin(i * 0.8), 2) * 45;
                        break;
                    case 'serpentine':
                        x = Math.sin(i * 0.9) * 50;
                        z = (i - count / 2) * 18;
                        y = (i / count) * 35;
                        break;
                    case 'figure8':
                        x = Math.sin(angle) * 70;
                        z = Math.sin(angle * 2) * 35;
                        y = Math.cos(angle * 2) * 12 + 10;
                        break;
                }
                points.push(new THREE.Vector3(x, Math.max(0, y), z));
            }
            return points;
        }

        // Построение 3D-меша дороги вдоль сплайна
        function generateTrack(type = 'hilly') {
            // Удаляем старую трассу
            if (trackMesh) scene.remove(trackMesh);
            if (borderLinesMesh) scene.remove(borderLinesMesh);
            pillarsGroup.clear();

            const controlPoints = getControlPoints(type);

            // 1. Создаем 3D-сплайн
            const spline = new THREE.CatmullRomCurve3(controlPoints, true, 'centripetal');
            const trackLength = Math.round(spline.getLength());

            // 2. Формируем 2D-профиль дороги
            const roadWidth = 6;
            const shape = new THREE.Shape();
            shape.moveTo(-roadWidth / 2, -0.4);
            shape.lineTo(roadWidth / 2, -0.4);
            shape.lineTo(roadWidth / 2, 0);
            shape.lineTo(-roadWidth / 2, 0);
            shape.closePath();

            // 3. ExtrudeGeometry — протаскивание формы вдоль 3D-сплайна
            const extrudeSettings = {
                steps: 200,
                bevelEnabled: false,
                extrudePath: spline
            };

            const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            const material = new THREE.MeshStandardMaterial({
                color: 0x1e1b4b,
                roughness: 0.4,
                metalness: 0.2,
                wireframe: false
            });

            trackMesh = new THREE.Mesh(geometry, material);
            scene.add(trackMesh);

            // 4. Добавляем светящиеся края дороги
            const tubeGeo = new THREE.TubeGeometry(spline, 200, roadWidth / 2 + 0.2, 8, true);
            const wireGeo = new THREE.WireframeGeometry(tubeGeo);
            borderLinesMesh = new THREE.LineSegments(wireGeo, new THREE.LineBasicMaterial({ color: 0x06b6d4, opacity: 0.3, transparent: true }));
            scene.add(borderLinesMesh);

            // 5. Создаем 3D-опоры/колонны для участков над землей
            const points = spline.getSpacedPoints(40);
            let maxY = 0;

            points.forEach(p => {
                if (p.y > maxY) maxY = p.y;
                if (p.y > 3) {
                    const pillarGeo = new THREE.CylinderGeometry(0.6, 0.8, p.y, 8);
                    const pillarMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
                    const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                    pillar.position.set(p.x, p.y / 2, p.z);
                    pillarsGroup.add(pillar);
                }
            });

            // Обновление статистики UI
            document.getElementById('stat-points').textContent = controlPoints.length;
            document.getElementById('stat-length').textContent = trackLength + 'm';
            document.getElementById('stat-height').textContent = Math.round(maxY) + 'm';
        }

        function generateRandomTrack() {
            const types = ['hilly', 'coaster', 'serpentine', 'figure8'];
            const randomType = types[Math.floor(Math.random() * types.length)];
            generateTrack(randomType);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
