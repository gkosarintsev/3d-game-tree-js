<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Шутер</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #05080d; }
  body { font-family: "Segoe UI", system-ui, sans-serif; color: #e8eef7; cursor: default; }
  canvas { display: block; }

  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

  .panel {
    position: absolute; padding: 12px 16px; border-radius: 10px;
    background: rgba(8, 14, 24, .62); border: 1px solid rgba(120, 170, 255, .18);
    backdrop-filter: blur(6px); font-size: 13px; line-height: 1.65;
  }
  #help { top: 16px; left: 16px; }
  #help b { color: #7fb6ff; font-weight: 600; }
  kbd {
    display: inline-block; min-width: 20px; text-align: center; padding: 1px 5px;
    border-radius: 5px; background: #1b2a3d; border: 1px solid #33506f;
    font-family: inherit; font-size: 12px; color: #cfe2ff;
  }

  #stats { top: 16px; right: 16px; text-align: right; min-width: 150px; }
  #stats .row { display: flex; justify-content: space-between; gap: 18px; }
  #stats .lbl { opacity: .6; }
  #stats .val { color: #ffd76a; font-variant-numeric: tabular-nums; font-weight: 600; }

  #minimapWrap { position: absolute; right: 16px; bottom: 16px; padding: 8px; }
  #minimap { display: block; width: 168px; height: 168px; border-radius: 6px; }

  #vitals { left: 16px; bottom: 16px; min-width: 208px; }
  #vitals .val { font-size: 15px; }
  #hpBar {
    height: 9px; margin: 5px 0 4px; border-radius: 5px;
    background: #1b2a3d; border: 1px solid rgba(120,170,255,.15); overflow: hidden;
  }
  #hpFill { height: 100%; width: 100%; background: #4ad06b; transition: width .12s linear; }

  #hitmark {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 26px; line-height: 1; color: #ff6a5c; opacity: 0;
    text-shadow: 0 0 6px rgba(255, 60, 40, .9); transition: opacity .06s linear;
    user-select: none;
  }

  #damage {
    position: fixed; inset: 0; z-index: 9; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 50%, rgba(190, 0, 0, 0) 32%, rgba(190, 0, 0, .62) 100%);
    transition: opacity .12s linear;
  }

  #crosshair {
    position: absolute; left: 50%; top: 50%; width: 16px; height: 16px;
    transform: translate(-50%, -50%);
  }
  #crosshair::before, #crosshair::after {
    content: ""; position: absolute; background: rgba(255,255,255,.75);
  }
  #crosshair::before { left: 50%; top: 0; width: 1.5px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 1.5px; width: 100%; transform: translateY(-50%); }

  #overlay {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, rgba(18, 30, 50, .82), rgba(3, 6, 11, .96));
    cursor: pointer; text-align: center;
  }
  #overlay.hidden { display: none; }
  .card { max-width: 520px; padding: 34px 40px; }
  .card h1 { font-size: 30px; letter-spacing: .5px; margin-bottom: 6px; }
  .card h1 span { color: #7fb6ff; }
  .card p { opacity: .78; font-size: 14px; line-height: 1.8; }
  .card .lead { opacity: .7; font-size: 14px; margin-bottom: 4px; }
  .btn {
    display: inline-block; margin-top: 22px; padding: 12px 28px; border-radius: 9px;
    background: linear-gradient(180deg, #3d7fe0, #275ba8); color: #fff; font-size: 15px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(40, 100, 200, .35);
  }
  .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .actions .btn { margin-top: 22px; }
  .btn.ghost {
    background: rgba(20, 32, 52, .72); border: 1px solid rgba(120, 170, 255, .28);
    box-shadow: none; font-weight: 500;
  }
  .btn.ghost:hover { background: rgba(34, 56, 92, .85); border-color: #7fb6ff; }
  .keys { margin-top: 20px; font-size: 12.5px; opacity: .65; }

  .roles { display: flex; gap: 16px; margin-top: 22px; }
  .role {
    flex: 1; padding: 18px 18px 16px; border-radius: 12px; cursor: pointer;
    background: rgba(20, 32, 52, .72); border: 1px solid rgba(120, 170, 255, .22);
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .role:hover { transform: translateY(-3px); border-color: #7fb6ff; background: rgba(34, 56, 92, .85); }
  .role h2 { font-size: 19px; margin-bottom: 8px; }
  .role[data-role="alien"] h2 { color: #8ef0a6; }
  .role[data-role="human"] h2 { color: #7fb6ff; }
  .role p { opacity: .72; font-size: 12.5px; line-height: 1.7; }
</style>
</head>
<body>

<div id="damage"></div>

<div id="hud">
  <div class="panel" id="help">
    <b>Управление</b><br>
    <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — движение<br>
    <kbd>Мышь</kbd> — обзор, <kbd>Shift</kbd> — бег<br>
    <kbd>ЛКМ</kbd> — огонь, <kbd>Space</kbd> — прыжок, <kbd>Esc</kbd> — пауза
  </div>

  <div class="panel" id="stats">
    <div class="row"><span class="lbl">Монеты</span><span class="val" id="coins">0 / 12</span></div>
    <div class="row"><span class="lbl">Время</span><span class="val" id="time">0:00</span></div>
  </div>

  <div class="panel" id="vitals">
    <div class="row"><span class="lbl">Здоровье</span><span class="val" id="hp">100</span></div>
    <div id="hpBar"><div id="hpFill"></div></div>
    <div class="row"><span class="lbl">Уничтожено</span><span class="val" id="kills">0</span></div>
  </div>

  <div class="panel" id="minimapWrap"><canvas id="minimap" width="336" height="336"></canvas></div>
  <div id="crosshair"></div>
  <div id="hitmark">✕</div>
</div>

<div id="overlay">
  <div class="card">
    <h1>3D <span>Шутер</span></h1>
    <p class="lead">Загрузка…</p>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/dist/rapier.mjs"
  }
}
</script>

<script type="module" src="./src/main.js"></script>
</body>
</html>
